{% extends "base.html" %}
{% block content %}
<section class="wrap page">
    <h1>Участники: {{ session.workshop.title }}</h1>
    <div class="panel">
        {% for b in participants %}
        <p>{{ b.user.get_full_name|default:b.user.username }} — {{ b.get_ticket_type_display }} — {{ b.get_status_display }}</p>
        {% empty %}
        <p>Участников пока нет.</p>
        {% endfor %}
    </div>
</section>
{% endblock %}
