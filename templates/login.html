{% extends "base.html" %}
{% block title %}Вход — ВКУСНО{% endblock %}
{% block content %}
<section class="wrap page narrow">
    <div class="panel">
        <h1>Войти</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="button full" type="submit">Войти</button>
        </form>
        <p>Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрироваться</a></p>
    </div>
</section>
{% endblock %}
